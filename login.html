<!DOCTYPE html>
<html>
<head>
     <title>Priscom Login</title>
     <style>
       body{
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            font-family: Arial, sans-serif;
        }
        .login-box{
            width: 350px;
            padding: 40px;
            background: #111;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 120, 255, 0.35);
        }
        h1 {
            color: #168cff;
            margin-bottom: 2px;
            font-size: 25px;
        }
        p {
            color: white;
            margin-bottom: 30px;
            font-size: 20px;
        }
        input{
            width: 90%;
            padding: 13px;
            margin: 8px;
            border-radius: 7px;
            border: 1px solid #333;
            background: #222;
            color: white;
        }
        button {
            width: 95%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 7px;
            background: #168cff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .error-msg{
            color: #ff4d4d;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .link-text {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }
        .link-text a {
            color: #168cff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>PRISCOM NET-TECH</h1>
        <p>The Beacon of Circuitry</p>
        
        <div id="errorMsg" class="error-msg"></div>
       
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">LOGIN</button>
        </form>

        <div class="link-text">
            Don't have an account? <a href="/signup">Sign up</a>
        </div>
        <div class="link-text" style="margin-top: 5px;">
            <a href="/reset-password">Forgot password?</a>
        </div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({username, password})
                });
                const data = await response.json();
                if(response.ok && data.success){
                    window.location.href = data.redirect;
                } else {
                    errorDiv.textContent = data.message || 'Invalid username or password';
                }
            } catch (err) {
                errorDiv.textContent = 'Server connection error.';
            }
        });
    </script>
</body>
</html>
